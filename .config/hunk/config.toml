theme = "custom"
mode = "auto"        # auto, split, stack
vcs = "git"          # git, jj, sl
watch = false
exclude_untracked = true
line_numbers = true
wrap_lines = false
menu_bar = false
agent_notes = false
prompt_save_view_preferences = true
transparent_background = false

[custom_theme]
base = "rose-pine"
label = "OpenCode RosePine"
accent = "#9ccfd8"
accentMuted = "#31748f"
panel = "#1f1d2e"
panelAlt = "#26233a"
border = "#403d52"
text = "#e0def4"
muted = "#6e6a86"
addedBg = "#1d2a2e"
removedBg = "#2a1e24"
movedAddedBg = "#1e2333"
movedRemovedBg = "#25233a"
contextBg = "#191724"
addedContentBg = "#1d2a2e"
removedContentBg = "#2a1e24"
contextContentBg = "#191724"
addedSignColor = "#9ccfd8"
removedSignColor = "#eb6f92"
lineNumberBg = "#1f1d2e"
lineNumberFg = "#6e6a86"
selectedHunk = "#403d52"
badgeAdded = "#31748f"
badgeRemoved = "#eb6f92"
badgeNeutral = "#6e6a86"
fileNew = "#31748f"
fileDeleted = "#eb6f92"
fileRenamed = "#f6c177"
fileModified = "#9ccfd8"
fileUntracked = "#c4a7e7"
noteBorder = "#c4a7e7"
noteBackground = "#1f1d2e"
noteTitleBackground = "#26233a"
noteTitleText = "#e0def4"

[custom_theme.syntax_scopes]
"comment" = "#6e6a86"
"punctuation.definition.comment" = "#6e6a86"
"keyword" = "#31748f"
"keyword.operator" = "#908caa"
"string" = "#f6c177"
"constant.numeric" = "#c4a7e7"
"entity.name.function" = "#ebbcba"
"support.function" = "#ebbcba"
"variable.function" = "#ebbcba"
"variable" = "#e0def4"
"variable.other.property" = "#e0def4"
"support.variable.property" = "#e0def4"
"entity.name.type" = "#9ccfd8"
"entity.name.class" = "#9ccfd8"
"support.type" = "#9ccfd8"
"support.class" = "#9ccfd8"
"punctuation" = "#908caa"
