# https://builtin.com/articles/tmux-config

# Plugins

# Saves a lot of crucial aspects about all tmux sessions 
# this is a manual process though - with keybindings to
# save and restore.
# set -g @plugin 'tmux-plugins/tmux-resurrect'

# Reload neovim session state, used with tpope/vim-obsession
# set -g @resurrect-strategy-nvim 'session'

# Automates saving and restoring with tmux-resurrect
# set -g @plugin 'tmux-plugins/tmux-continuum'
# set -g @continuum-restore 'on'
# set -g @continuum-save-interval '1' # mins

set-option -g default-shell /usr/bin/zsh

unbind C-Space
set -g prefix C-space
bind C-space  send-prefix

# Vim mode bindings
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
unbind-key -T copy-mode-vi y
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

set-option -ga terminal-overrides ",xterm-256color:Tc"
set -g extended-keys always

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
# Can use mouse in tmux
set -g mouse on

# Kill panes. Default is prefix+x with confirmation. This is cringe.
# 9 because thats the linux kill signal
bind-key 9 kill-pane

# Create and delete windows with n and w
unbind C-c
# Keep pane/window path on new pane/window
bind n neww -c "#{pane_current_path}"
bind w killw

# Switch to previous session/client 
bind-key p switch-client -l

# Switch to specific sessions. Do this through tmux-sessionizer.sh script 
# since it will make sessions if they do not already exist
bind-key -T prefix v run-shell "tmux-sessionizer.sh vault"
bind-key -T prefix . run-shell "tmux-sessionizer.sh dotfiles" 

# Unbind session searching
unbind s 

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
